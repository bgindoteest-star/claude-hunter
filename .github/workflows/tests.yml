name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Compile check
        run: |
          .venv/bin/python -m py_compile hunter.py hunt_cli.py test_hunter.py

      - name: Run test suite
        run: .venv/bin/python3 test_hunter.py

      - name: CLI smoke test
        run: .venv/bin/python3 hunt_cli.py --help
